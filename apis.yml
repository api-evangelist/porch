aid: porch
name: Porch
description: >-
  Porch Group is a home services and home insurance platform operating across
  the full lifecycle of the home. Trading on Nasdaq as PRCH, the company
  combines a vertical software business for home inspectors, moving companies,
  title and mortgage providers, and contractors with a consumer-facing home
  insurance carrier (Porch Insurance Reciprocal Exchange), home warranty, and a
  moving-concierge app that helps homeowners set up utilities, security, and
  services. Porch reaches a large share of U.S. homebuyers each year through its
  inspection-software network, using that unique early-in-the-home-lifecycle data
  to power insurance, warranty, and moving offerings. This profile was seeded as a
  Battery Ventures portfolio lead and enriched by the API Evangelist pipeline;
  Porch publishes no public developer API, but it does operate a responsible
  disclosure program and RFC 9116 security.txt.
